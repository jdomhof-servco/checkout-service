name: Deploy Hotfix to Production

on:
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy Checkout Service v4.7.2
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy hotfix
        run: |
          echo "Starting hotfix deployment for checkout-service..."
          echo "Release: v4.7.2 (Fixes Dankort DECLINE_55 parser regression)"
          echo "Target cluster: aks-payments-prod-weu-01"
          sleep 5
          echo "Deployment successful."
